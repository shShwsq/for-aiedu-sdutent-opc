# AgentPair 生产 Nginx 配置:托管前端静态产物 + 反代后端 API
#
# 关键约定:
# 1. 前端所有请求走 /api 前缀,此处反代到后端并去掉前缀
#    (/api/auth/login → http://backend:8000/auth/login)
# 2. SSE 事件流(/api/tasks/{id}/stream、/api/practice/generate/{jobId}/stream)
#    必须关闭 proxy_buffering,否则前端收不到实时 token 事件
server {
    listen 80;
    server_name _;

    # skill zip 上传上限 50MB,留余量
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物:长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 路由:未匹配文件回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代:proxy_pass 尾斜杠自动去掉 /api 前缀
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键配置:禁止缓冲 + 长超时(任务流/出题流可能运行几十分钟)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API 文档(可选)
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
